<h4>Signal Forms</h4>
<form [formRoot]="profileForm">
  <fieldset>
    <label for="name">Name</label>
    <input type="text" class="input" [formField]="profileForm.name">
  </fieldset>
</form>

<div class="mt-5">
  <p>Name: {{ profileForm.name().value() }}</p>
  <p>Name: {{ profileModel().name }}</p>
</div>

<hr>

  <fieldset>
    <label for="">Email</label>
    <input type="text" class="input" formControlName="email">
  </fieldset>
</form>
