<ng-container [ngTemplateOutlet]="toastAlert"></ng-container>

<div class="container mx-auto">
  <section class="px-24 py-12">
    <h3 class="text-[1.5em] font-bold mb-5">Products</h3>
    @defer (when productsResource.hasValue()) {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" animate.enter="fade-in">
        @for (product of products(); track product.id) {
          <app-product-card [product]="product" (addToCart)="addToCart($any($event))" />
        }
      </div>
    } @placeholder {
      <app-product-skeleton />
    } @loading (after 300ms) {
      <app-product-skeleton />
    } @error {
      <p role="alert" class="text-error">Failed to load products. Please try again later.</p>
    }
  </section>
</div>

<ng-template #toastAlert>
  @if (toastMsg()) {
    <div class="toast toast-top toast-center z-50">
      <div class="alert alert-success animate-toast-in">{{ toastMsg() }}</div>
    </div>
  }
</ng-template>
