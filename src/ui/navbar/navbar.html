<div class="navbar bg-base-100 shadow-sm">
  <div class="navbar-start">
    <a class="btn btn-ghost text-xl">Simple Store</a>

    <ul class="menu menu-horizontal">
      <li><a routerLink="">Home</a></li>
    </ul>

    <button class="btn sm:hidden" popovertarget="categories-megamenu">Categories</button>
    <div class="megamenu max-sm:megamenu-vertical megamenu-wide w-full" id="categories-megamenu" popover>
      <span class="megamenu-active"></span>
      <button popovertarget="all-categories">Categories</button>
      <div id="all-categories" popover class="w-fit">
        <ul class="menu grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2">
          @for (category of categories(); track category) {
            <li>
              <a [routerLink]="['/product', category]">
                {{ formatCategory(category) | titlecase }}
              </a>
            </li>
          }
        </ul>
      </div>
    </div>

  </div>


  <div class="flex gap-2 ms-auto items-center">
    <div class="navbar-end">
      <app-theme-controller class="me-3"/>
      <button class="btn btn-ghost btn-circle" (click)="searchModal.show()">
        <ng-icon name="heroMagnifyingGlass" size="22"/>
      </button>
      <button class="btn btn-ghost btn-circle" (click)="toggleCart(true)">
        <div class="indicator">
          <ng-icon name="heroShoppingCart" size="22"/>
          <span class="badge badge-xs badge-primary indicator-item">{{ cartCount() }}</span>
        </div>
      </button>
    </div>
  </div>
</div>

<!--{{ showCart }}-->
<app-cart [attr.role]="showCart" [showCart]="showCart" (toggleCart)="toggleCart($event)"/>

<dialog id="search-modal" class="modal" #searchModal>
  <div class="modal-box">
    <h3 class="text-lg font-bold">Search</h3>
    <p class="py-4">
      <input type="text" placeholder="Search..." class="input input-bordered w-full" />
    </p>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
