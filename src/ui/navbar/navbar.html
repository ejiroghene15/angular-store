<div class="navbar bg-base-100 shadow-sm">
  <div class="flex-">
    <a class="btn btn-ghost text-xl">Simple Store</a>
  </div>
  <ul class="menu menu-horizontal">
    <li><a routerLink="">Home</a></li>
<!--    <li><a routerLink="/settings/security">Settings</a></li>-->
  </ul>

  <div class="flex gap-2 ms-auto items-center">
    <div class="navbar-end">
      <app-theme-controller class="me-3"/>
      <button class="btn btn-ghost btn-circle" (click)="toggleCart(true)">
        <div class="indicator">
          <ng-icon name="heroShoppingCart" size="22"/>
          <span class="badge badge-xs badge-primary indicator-item">{{ cartCount() }}</span>
        </div>
      </button>
    </div>
  </div>
</div>

<!--{{ showCart }}-->
<app-cart [attr.role]="showCart" [showCart]="showCart" (toggleCart)="toggleCart($event)"/>
